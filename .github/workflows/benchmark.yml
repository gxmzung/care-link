name: CARE-LINK benchmark artifact
on:
  push:
    branches: ["feat/demo-report-v0.4"]
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run reproducible synthetic benchmark
        run: |
          mkdir -p artifacts
          python -m app.benchmark > artifacts/benchmark.json
          python -m json.tool artifacts/benchmark.json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: care-link-synthetic-benchmark
          path: artifacts/benchmark.json
